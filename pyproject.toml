[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-os"
version = "0.2.0"
description = "A local LLM operating environment with context paging, scoped apps, and versioned files"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llm-os = "llm_os.__main__:main"

[tool.setuptools.packages.find]
include = ["llm_os*"]

[tool.setuptools.package-data]
llm_os = ["static/*"]
